services:
  - type: web
    name: exam-sheet-mcp
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:http
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PUBLIC_URL
        value: https://exam-sheet-mcp.onrender.com
